<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · RAINER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">RAINER · DISDROMETER</p>
    <h1>Deine Messdaten im Blick</h1>
    <p class="hint">Melde dich an, um das Dashboard zu öffnen.</p>
    {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Benutzername<input name="username" autocomplete="username" required autofocus maxlength="120"></label>
      <label>Passwort<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label>
      <button class="primary" type="submit">Anmelden</button>
    </form>
  </main>
</body>
</html>
